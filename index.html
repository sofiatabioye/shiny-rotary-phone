                    <div class="flex justify-between text-gray-600"><span>🛂 Visa Cost</span><span>${country.budget.visaCost}</span></div>

                budgetBreakdown = `
                    <div class="flex justify-between text-gray-600 mb-1"><span>✈️ Flights</span><span>${country.budget.flights}</span></div>

                    <h3 class="text-xs font-bold text-gray-800 uppercase mb-2 mt-4">🎢 TOP 3 ACTIVITIES:</h3>
                    <ul class="text-sm text-gray-600 space-y-1 mb-3">
                                ${country.activities.map(activity => `
                                    <li class="flex items-start"><i class="fas fa-ticket-alt ${activityColors.activityIcon} mt-1 mr-2"></i> ${activity}</li>
                                `).join('')}
                    </ul>

                            <a href="${country.activitiesLink}" target="_blank" class="block w-full text-center ${colors.linkBg} ${colors.linkHover} ${colors.linkText} text-xs font-bold py-2 rounded border ${colors.border} transition mb-2">
                        🔗 Check Activities
                    </a>
                    <a href="${country.tripPackagesLink}" target="_blank" class="block w-full text-center bg-purple-50 hover:bg-purple-100 text-purple-700 text-xs font-bold py-2 rounded border border-purple-200 transition">
                        ✈️ Check Package Holidays
                    </a>
                </div>
                
                 <div class="mt-auto pt-4 border-t border-dashed border-gray-200">
                     <div class="flex justify-between items-end">
                        <div>
                            <p class="text-xs text-gray-400 uppercase">Visa Check</p>
                                    <p class="text-sm font-bold ${visaCheckColorClass}">${country.visaCheck}</p>
                        </div>
                               
                </div>
                        </div>
                    </div>
                </div>
            `;
        }
        // <button class="${country.buttonColor} text-white text-xs font-bold px-4 py-2 rounded-lg ${country.buttonHoverColor} transition">VOTE</button>
        // Render countries (data is already embedded above)
        const container = document.getElementById('cards-container');
        container.innerHTML = countries.map(country => createCard(country)).join('');
    </script>
